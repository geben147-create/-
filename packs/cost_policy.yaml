# Cost is a mechanism, not a belief. The mechanism stays even when the policy
# relaxes: today's zero-credit ceiling is one number, not an assumption baked
# into the code. The day paid runs are allowed, change the number.
schema_version: 1
max_credit_per_shot: 0        # ZERO means zero. A cheaper paid model is still paid.
# Enforced by pipeline/cost_gate.py -- call assert_free() before every submit.
# Read discountCost, never cost: a promotion can zero the list price, and the
# wrong field either blocks free work or waves paid work through.
paid_fallback: false
require_canary: true          # 2 shots must pass before a batch
concurrency: 1
submissions_per_run_max: 24
deadline_minutes: 45
quote_before_submit: true     # quoting is free; submitting is not
log: one submission = one journal line (model, quote, actual credits)
